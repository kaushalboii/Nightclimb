[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nightclimb"
version = "2.0.0"
description = "Terminal arcade collection: BOUNCE (Nokia classic) + SNAKE (enhanced retro)"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "kaushalboii", email = "kaushal@example.com"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console :: Curses",
    "Topic :: Games/Entertainment :: Arcade",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]
requires-python = ">=3.7"
dependencies = []

[project.optional-dependencies]
windows = ["windows-curses>=2.4"]
dev = ["pytest>=7.0", "black>=23.0", "ruff>=0.1"]

[project.scripts]
nightclimb = "bounce_game.launcher:cli_main"
bounce = "games.bounce.main:main"
snake = "games.snake.main:main"

[project.urls]
Homepage = "https://github.com/kaushalboii/Nightclimb"
Repository = "https://github.com/kaushalboii/Nightclimb"
Issues = "https://github.com/kaushalboii/Nightclimb/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["bounce_game*", "games*"]

[tool.setuptools.package-dir]
"" = "."

[tool.ruff]
line-length = 100
target-version = "py37"