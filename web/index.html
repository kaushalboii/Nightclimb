<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nightclimb — BOUNCE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
            background: #0d0d0d;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: #1a1a1a;
            border-bottom: 2px solid #333;
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #ff4444;
            letter-spacing: 0.1em;
        }
        .subtitle {
            font-size: 0.75rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.2em;
        }
        .controls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .btn {
            background: #2a2a2a;
            border: 1px solid #444;
            color: #e0e0e0;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.8rem;
            transition: all 0.15s;
        }
        .btn:hover { background: #3a3a3a; border-color: #666; }
        .btn:active { background: #444; }
        .btn.primary { background: #ff4444; border-color: #ff4444; color: #fff; }
        .btn.primary:hover { background: #ff6666; }
        .main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }
        .terminal-container {
            width: 100%;
            max-width: 900px;
            background: #0d0d0d;
            border: 2px solid #333;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(255, 68, 68, 0.1);
        }
        #terminal {
            width: 100%;
            height: 600px;
        }
        .footer {
            background: #1a1a1a;
            border-top: 1px solid #333;
            padding: 16px 24px;
            text-align: center;
            color: #666;
            font-size: 0.8rem;
        }
        .footer a { color: #ff4444; text-decoration: none; }
        .footer a:hover { text-decoration: underline; }
        .status-bar {
            display: flex;
            justify-content: space-between;
            padding: 8px 16px;
            background: #111;
            border-top: 1px solid #333;
            font-size: 0.7rem;
            color: #888;
            font-family: inherit;
        }
        .status-item { display: flex; gap: 4px; }
        .status-label { color: #555; }
        .status-value { color: #aaa; }
        .status-value.lives { color: #ff4444; }
        .status-value.stars { color: #ffdd44; }
        .status-value.score { color: #44ff88; }
        @media (max-width: 768px) {
            .header { flex-direction: column; text-align: center; }
            .title { font-size: 1.2rem; }
            #terminal { height: 500px; }
            .main { padding: 12px; }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div>
            <div class="title">NIGHTCLIMB</div>
            <div class="subtitle">BOUNCE — Terminal Edition</div>
        </div>
        <div class="controls">
            <button class="btn" id="btn-new">New Game</button>
            <button class="btn" id="btn-continue">Continue</button>
            <button class="btn primary" id="btn-fullscreen">Fullscreen</button>
        </div>
    </header>

    <main class="main">
        <div class="terminal-container">
            <div id="terminal"></div>
            <div class="status-bar">
                <div class="status-item"><span class="status-label">Level:</span><span class="status-value" id="stat-level">1</span></div>
                <div class="status-item"><span class="status-label">Lives:</span><span class="status-value lives" id="stat-lives">♥♥♥</span></div>
                <div class="status-item"><span class="status-label">Stars:</span><span class="status-value stars" id="stat-stars">0/7</span></div>
                <div class="status-item"><span class="status-label">Score:</span><span class="status-value score" id="stat-score">0</span></div>
                <div class="status-item"><span class="status-label">Best:</span><span class="status-value" id="stat-best">—</span></div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>Arrow Keys / WASD to move · Space to jump · P to pause · R to restart · M for menu</p>
        <p style="margin-top: 8px;">Terminal version: <a href="https://github.com/kaushalboii/Nightclimb">github.com/kaushalboii/Nightclimb</a> · Original: Nokia Bounce (2008)</p>
    </footer>

    <script type="module" src="./game.js"></script>
</body>
</html>
