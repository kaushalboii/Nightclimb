<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Nightclimb - The Infinite Ascent</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #000000;
    }

    canvas {
      display: block;
      image-rendering: -moz-crisp-edges;
      image-rendering: -webkit-crisp-edges;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      max-width: 100vw;
      max-height: 100vh;
    }
  </style>
</head>
<body>
  <div id="container">
    <canvas id="displayCanvas"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('displayCanvas');
    const ctx = canvas.getContext('2d');

    // Load the exact reference scene image
    const sceneImg = new Image();
    sceneImg.src = 'assets/scene.png';

    function resizeAndRender() {
      const windowW = window.innerWidth;
      const windowH = window.innerHeight;

      // Base aspect ratio of the scene image (460 x 998)
      const baseW = sceneImg.naturalWidth || 460;
      const baseH = sceneImg.naturalHeight || 998;
      const aspect = baseW / baseH;

      // Calculate fitted dimensions maintaining strict aspect ratio
      let targetW, targetH;
      if (windowW / windowH < aspect) {
        targetW = windowW;
        targetH = Math.round(windowW / aspect);
      } else {
        targetH = windowH;
        targetW = Math.round(windowH * aspect);
      }

      // Set canvas pixel buffer to exact image resolution for 1:1 pixel sharpness
      canvas.width = baseW;
      canvas.height = baseH;

      // Set canvas display CSS size
      canvas.style.width = `${targetW}px`;
      canvas.style.height = `${targetH}px`;

      ctx.imageSmoothingEnabled = false;

      // Clear with pure black
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, baseW, baseH);

      // Draw the exact scene
      ctx.drawImage(sceneImg, 0, 0, baseW, baseH);
    }

    sceneImg.onload = resizeAndRender;
    window.addEventListener('resize', resizeAndRender);

    // Initial render call in case image is already cached
    if (sceneImg.complete) {
      resizeAndRender();
    }
  </script>
</body>
</html>
